name: App Store candidate build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Require the App Store upload toolchain
        run: |
          xcode_major="$(xcodebuild -version | awk 'NR == 1 { split($2, value, "."); print value[1] }')"
          if (( xcode_major < 26 )); then
            echo "Xcode 26 or newer is required; runner has $(xcodebuild -version | head -1)." >&2
            exit 1
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install signing dependencies
        run: |
          gem install fastlane --version 2.237.0 --no-document

      - name: Install or renew the distribution certificate and profile
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          match_auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)"
          echo "::add-mask::$match_auth"
          export MATCH_GIT_BASIC_AUTHORIZATION="$match_auth"
          fastlane ios prepare_ci_signing

      - name: Verify required profile entitlements
        run: |
          profile_path="$(find "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            -maxdepth 1 -name '*.mobileprovision' -print -quit)"
          test -n "$profile_path"
          security cms -D -i "$profile_path" > "$RUNNER_TEMP/bodybuddies-profile.plist"

          aps_environment="$(/usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:aps-environment' \
            "$RUNNER_TEMP/bodybuddies-profile.plist")"
          apple_sign_in="$(/usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:com.apple.developer.applesignin:0' \
            "$RUNNER_TEMP/bodybuddies-profile.plist")"

          test "$aps_environment" = "production"
          test "$apple_sign_in" = "Default"
          echo "Provisioning profile contains production APNs and Sign in with Apple."

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          cache: true

      - name: Install app dependencies
        run: |
          flutter pub get
          cd ios
          pod install

      - name: Build signed App Store candidate IPA
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          PAYMENT_INTENT_ENDPOINT: ${{ secrets.PAYMENT_INTENT_ENDPOINT }}
          PAYMENT_INTENT_TEST_ENDPOINT: ${{ secrets.PAYMENT_INTENT_TEST_ENDPOINT }}
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=PAYMENT_MODE=auto \
            --dart-define=STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
            --dart-define=STRIPE_TEST_PUBLISHABLE_KEY="$STRIPE_TEST_PUBLISHABLE_KEY" \
            --dart-define=PAYMENT_INTENT_ENDPOINT="$PAYMENT_INTENT_ENDPOINT" \
            --dart-define=PAYMENT_INTENT_TEST_ENDPOINT="$PAYMENT_INTENT_TEST_ENDPOINT"
          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"

      - name: Upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          ipa_path="$(find "$GITHUB_WORKSPACE/build/ios/ipa" \
            -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          fastlane ios upload_ipa ipa_path:"$ipa_path"

      - name: Retain IPA for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodybuddies-ios-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 7
